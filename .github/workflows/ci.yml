name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml-service-contract-tests:
    name: FastAPI ML Contract Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ml-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install ML service test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ML service tests
        run: python -m pytest tests/ -v

  frontend-regression-tests:
    name: Frontend Regression Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: optiserve-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: optiserve-backend/package-lock.json

      - name: Install frontend test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend regression tests
        run: npm run test:frontend

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: optiserve
          POSTGRES_USER: optiserve
          POSTGRES_PASSWORD: optiserve
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U optiserve -d optiserve"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
         OPTISERVE_DB_URL: jdbc:postgresql://localhost:5432/optiserve
         OPTISERVE_DB_USERNAME: optiserve
         OPTISERVE_DB_PASSWORD: optiserve
         OPTISERVE_JWT_SECRET: VGhpc0lzQVRlc3RTZWNyZXRGb3JDb25maWd1cmF0aW9u

    defaults:
      run:
        working-directory: optiserve-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java version
        run: java --version

      - name: Verify Maven Wrapper
        run: |
          test -f .mvn/wrapper/maven-wrapper.properties
          test -x ./mvnw

      - name: Build and Test
        run: ./mvnw --batch-mode clean verify
