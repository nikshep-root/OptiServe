ket drop that held up on launch day.\u003c/p>\n          \u003ca class=\"go f-p\" href=\"#work\" data-ps>\u003cspan>View project\u003c/span>\u003csvg viewBox=\"0 0 20 20\">\u003cpath d=\"m11.1075 14.2752 4.2763-4.29004-4.2625-4.2625h1.9112l4.2625 4.27625-4.2763 4.27629h-1.9112ZM2.5 10.8102V9.17391h13.8188v1.63629H2.5Z\"/>\u003c/svg>\u003c/a>\n        \u003c/div>\n      \u003c/article>\n      \u003carticle class=\"card\">\n        \u003ca class=\"shot\" href=\"#work\" aria-label=\"Northwind Labs\" data-ps>\u003cimg crossorigin=\"anonymous\" alt=\"\" src=\"https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/embedded/fbdb9068cc5e30114983f8d1acf9d8ba3f4cb162b02ae6dc9908b0496f04f712.jpg\">\u003c/a>\n        \u003cdiv class=\"meta framed\">\u003ci class=\"corner tl\">\u003c/i>\u003ci class=\"corner tr\">\u003c/i>\u003ci class=\"corner bl\">\u003c/i>\u003ci class=\"corner br\">\u003c/i>\n          \u003cp class=\"cats\" data-ps>Brand System · Photography\u003c/p>\n          \u003ch3 class=\"f-h3\" data-ps>Northwind Labs\u003c/h3>\n          \u003cp class=\"desc f-p\" data-ps>An energy company that had outgrown its logo. We rebuilt the identity around the people who climb the towers.\u003c/p>\n          \u003ca class=\"go f-p\" href=\"#work\" data-ps>\u003cspan>View project\u003c/span>\u003csvg viewBox=\"0 0 20 20\">\u003cpath d=\"m11.1075 14.2752 4.2763-4.29004-4.2625-4.2625h1.9112l4.2625 4.27625-4.2763 4.27629h-1.9112ZM2.5 10.8102V9.17391h13.8188v1.63629H2.5Z\"/>\u003c/svg>\u003c/a>\n        \u003c/div>\n      \u003c/article>\n      \u003carticle class=\"card\">\n        \u003ca class=\"shot\" href=\"#work\" aria-label=\"Lumenary\" data-ps>\u003cimg crossorigin=\"anonymous\" alt=\"\" src=\"https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/embedded/ca37589a8f31795e08e224131a89d70645c1aa561b55bdb118191f95ad503129.jpg\">\u003c/a>\n        \u003cdiv class=\"meta framed\">\u003ci class=\"corner   whole surface into noise. */\nfunction reliefFrom(canvas, { strength = 2.6, blur = 1.2, size = 1024 } = {}) {\n  const src = document.createElement('canvas'); src.width = src.height = size;\n  const sc = src.getContext('2d');\n  if (blur > 0) sc.filter = `blur(${blur}px)`;\n  sc.drawImage(canvas, 0, 0, size, size);\n  sc.filter = 'none';\n  const d = sc.getImageData(0, 0, size, size).data;\n  const lum = new Float32Array(size * size);\n  for (let i = 0, j = 0; i \u003c d.length; i += 4, j++) lum[j] = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) / 255;\n  const out = document.createElement('canvas'); out.width = out.height = size;\n  const oc = out.getContext('2d'); const img = oc.createImageData(size, size);\n  const at = (x, y) => lum[((y + size) % size) * size + ((x + size) % size)];\n  for (let y = 0; y \u003c size; y++) for (let x = 0; x \u003c size; x++) {\n    const gx = (at(x + 1, y - 1) + 2 * at(x + 1, y) + at(x + 1, y + 1)) - (at(x - 1, y - 1) + 2 * at(x - 1, y) + at(x - 1, y + 1));\n    const gy = (at(x - 1, y + 1) + 2 * at(x, y + 1) + at(x + 1, y + 1)) - (at(x - 1, y - 1) + 2 * at(x, y - 1) + at(x + 1, y - 1));\n    let nx = -gx * strength, ny = -gy * strength, nz = 1;\n    const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;\n    const k = (y * size + x) * 4;\n    img.data[k] = (nx * 0.5 + 0.5) * 255; img.data[k + 1] = (ny * 0.5 + 0.5) * 255;\n    img.data[k + 2] = (nz * 0.5 + 0.5) * 255; img.data[k + 3] = 255;\n  }\n  oc.putImageData(img, 0, 0);\n  const t = new THREE.CanvasTexture(out);\n  t.colorSpace = THREE.NoColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;\n  return t;\n}\nfunction speckle(g, w, h, n, colors, r = 1.2) {\n  for (let i = 0; i \u003c n; i++) { g.fillStyle = colors[(rand() * colors.length) | 0]; const s = r * (0.5 + rand()); g.fillRect(rand() * w, rand() * h, s, s); }\n}\nconst std = (o) => new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.9, metalness: 0 }, o));\nconst basic = (o) => new THREE.MeshBasicMaterial(o);\nconst scene = new THREE.Scene();\nfunction add(mesh, parent) { (parent || scene).add(mesh); mesh.castShadow = true; mesh.receiveShadow = true; return mesh; }\nfunction box(w, h, d, mat, x = 0, y = 0, z = 0, parent) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); return add(m, parent); }\nfunction plane(w, h, mat, x, y, z, parent) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(x, y, z); return add(m, parent); }\nfunction sphere(r, mat, x, y, z, parent, ws = 24, hs = 18) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, ws, hs), mat); m.position.set(x, y, z); return add(m, parent); }\nfunction cyl(rt, rb, h, mat, x, y, z, parent, seg = 20) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.position.set(x, y, z); return add(m, parent); }\nfunction roundedBoxGeo(w, h, d, r, seg = 3) {\n  r = Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001);\n  const iw = w - 2 * r, ih = h - 2 * r, x = -iw / 2, y = -ih / 2;\n  const sh = new THREE.Shape(); const cr = Math.min(r, iw / 2, ih / 2) * 0.999;\n  sh.moveTo(x + cr, y); sh.lineTo(x + iw - cr, y); sh.quadraticCurveTo(x + iw, y, x + iw, y + cr); sh.lineTo(x + iw, y + ih - cr); sh.quadraticCurveTo(x + iw, y + ih, x + iw - cr, y + ih); sh.lineTo(x + cr, y + ih); sh.quadraticCurveTo(x, y + ih, x, y + ih - cr); sh.lineTo(x, y + cr); sh.quadraticCurveTo(x, y, x + cr, y);\n  const g = new THREE.ExtrudeGeometry(sh, { depth: Math.max(0.001, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: seg, curveSegments: seg * 2 });\n  g.center(); g.computeVertexNormals(); return g;\n}\nfunction rbox(w, h, d, r, mat, x = 0, y = 0, z = 0, parent, seg = 3) { const m = new THREE.Mesh(roundedBoxGeo(w, h, d, r, seg), mat); m.position.set(x, y, z); return add(m, parent); }\nconst UP = new THREE.Vector3(0, 1, 0);\nfunction limb(r, a, b, mat, parent, caps = 6, rad = 16) {\n  const d = b.clone().sub(a); const len = d.length();\n  const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, Math.max(0.005, len - r), caps, rad), mat);\n  m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(UP, d.normalize());\n  return add(m, parent);\n}\n\n/* ================= renderer / post ================= */\nconst renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });\nrenderer.outputColorSpace = THREE.SRGBColorSpace;\nrenderer.toneMapping = THREE.ACESFilmicToneMapping;\nrenderer.toneMappingExposure = 0.92;\nrenderer.shadowMap.enabled = true;\nrenderer.shadowMap.type = THREE.PCFSoftShadowMap;\nlet DPR = Math.min(window.devicePixelRatio || 1, 1.5);   // 1.5x on retina: the VHS pass + MSAA are fill-bound; the loop steps down further if frames run long\n\nscene.background = new THREE.Color(0xb9b09d);\nscene.fog = new THREE.FogExp2(0xb9b09d, 0.014);\nconst camera = new THREE.PerspectiveCamera(55, 1.6, 0.1, 80);\n\nconst rt = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, type: THREE.HalfFloatType, depthBuffer: true, stencilBuffer: false, samples: 2 });\nconst postScene = new THREE.Scene();\nconst postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);\n// VHS post pass — port of Canvas UI \"VHS\" (tape wave, jitter, crease, head switching, bloom bleed,\n// aberration, AC beat, grain, scanlines) applied to the rendered scene texture. Values = the docs demo.\nconst VHS = { speed: 0.5, wave: 1, jitter: 0.25, crease: 0.1, switching: 0.05, switchingHeight: 0.02, bloom: 0.4, aberration: 2, acBeat: 1, grain: 0.1, scanlines: 0.1, vignette: 0, barrel: 0, saturation: 1, exposure: 1 };\nwindow.VHS = VHS;\nconst postMat = new THREE.ShaderMaterial({\n  uniforms: {\n    tDiffuse: { value: rt.texture }, uRes: { value: new THREE.Vector2(2, 2) }, uFade: { value: 0 }, uTime: { value: 0 },\n    uWave: { value: VHS.wave }, uJitter: { value: VHS.jitter }, uCrease  ctx.fillStyle='rgba(216,178,122,0.17)'; ctx.fillRect(0,0,TW,TH);\n  ctx.globalCompositeOperation='source-over';\n  const dot=document.createElement('canvas'); dot.width=dot.height=4;\n  const dctx=dot.getContext('2d'); dctx.fillStyle='#000'; dctx.fillRect(0,0,1.5,1.5);\n  ctx.globalAlpha=0.11; ctx.fillStyle=ctx.createPattern(dot,'repeat'); ctx.fillRect(0,0,TW,TH);\n  const band=document.createElement('canvas'); band.width=1; band.height=3;\n  const bctx=band.getContext('2d'); bctx.fillStyle='#000'; bctx.fillRect(0,0,1,1);\n  ctx.globalAlpha=0.06; ctx.fillStyle=ctx.createPattern(band,'repeat'); ctx.fillRect(0,0,TW,TH);\n  ctx.globalAlpha=1;\n  ctx.restore();\n  const t = new T.CanvasTexture(c);\n  t.encoding = T.sRGBEncoding; t.anisotropy = 8; t.needsUpdate = true;\n  return t;\n}\n\n/* ======================================================================\n   2. GRAIN\n   ====================================================================== */\n(function grain(){\n  const n=160, c=document.createElement('canvas'); c.width=c.height=n;\n  const x=c.getContext('2d'), d=x.createImageData(n,n);\n  for(let i=0;i\u003cn*n;i++){\n    const v = 128 + (Math.random()-0.5)*168;\n    d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v; d.data[i*4+3]=255;\n  }\n  x.putImageData(d,0,0);\n  const url='url('+c.toDataURL()+')';\n  document.getElementById('pp-grain').style.backgroundImage=url;\n  document.getElementById('pp-grain2').style.backgroundImage=url;\n})();\n\n/* ======================================================================\n   3. SCENE\n   ====================================================================== */\nconst HOST = document.getElementById('paper-stage');\nconst hostRect = () => HOST.getBoundingClientRect();\nconst canvas = document.getElementById('pp-gl');\nconst renderer = new T.WebGLRenderer({canvas, antialias:true, alpha:true,\n                                      powerPreference:'high-performance'});\nrenderer.outputEncoding = T.sRGBEncoding;\nrenderer.toneM SH)}, uFlutter:{value:0}, uPhase:{value:0},\n  uRim:{value:0.62}, uRimA:{value:0.88}, uSpecA:{value:0.14},\n  uRimCol:{value:new T.Color(0xeaf2ff)}\n};\n\nconst WAVE = `\nuniform float uTime, uAmp, uFlutter, uPhase, uFreq, uTwist;\nuniform vec2  uSize;\n\n// the sheet hangs: it curls harder at the top than along the bottom edge\nfloat sAmp(float u, float v){ return uAmp*(0.10 + pow(u,1.35))*(0.50 + 0.64*v); }\nfloat sAmpV(float u){        return uAmp*(0.10 + pow(u,1.35))*0.64; }\n\nfloat sTheta(float u, float v){\n  float a  = sAmp(u,v);\n  float ph = uFreq*u + uTwist*v + uTime*0.40 + uPhase;\n  return a*sin(ph) + uFlutter*a*0.60*sin(ph*2.35 + uTime*2.0);\n}\nfloat sThetaV(float u, float v){\n  float a  = sAmp(u,v), da = sAmpV(u);\n  float ph = uFreq*u + uTwist*v + uTime*0.40 + uPhase;\n  float f  = ph*2.35 + uTime*2.0;\n  return da*sin(ph) + a*cos(ph)*uTwist\n       + uFlutter*0.60*(da*sin(f) + a*cos(f)*uTwist*2.35);\n}\nfloat sYoff(float u, float v){\n  float w = 1.0 - 0.55*v;\n  return 0.021*uSize.y*sin(2.05*u + uTime*0.47 + uPhase)\n       + 0.013*uSize.y*sin(3.35*u - 1.55*v + uTime*0.63 + uPhase)*w;\n}\nfloat sYdU(float u, float v){\n  float w = 1.0 - 0.55*v;\n  return 0.0431*uSize.y*cos(2.05*u + uTime*0.47 + uPhase)\n       + 0.0436*uSize.y*cos(3.35*u - 1.55*v + uTime*0.63 + uPhase)*w;\n}\nfloat sYdV(float u, float v){\n  float ph = 3.35*u - 1.55*v + uTime*0.63 + uPhase;\n  return 0.013*uSize.y*(-1.55*cos(ph)*(1.0-0.55*v) - 0.55*sin(ph));\n}\n\n// paper conserves arc length: integrate the bend instead of pushing Z,\n// so the silhouette really pulls in where the sheet turns away\nvoid sheetPoint(vec2 q, out vec3 P, out vec3 NN){\n  float u = q.x, v = q.y;\n  float x=0.0, z=0.0, xe=0.0, ze=0.0, dxv=0.0, dzv=0.0, dxe=0.0, dze=0.0;\n  const int NS = 20;\n  float h = 1.0/float(NS);\n  for(int i=0;i\u003cNS;i++){\n    float uu = (float(i)+0.5)*h;\n    float w  = clamp((u-(uu-0.5*h))/h, 0.0, 1.0);\n    float th = sTheta(uu,v);\n    float dt = sThetaV(uu,v);\n    float c = cos(th), sn = sin(th);\n    xe += c*h;          ze += sn*h;\n    dxe += -sn*dt*h;    dze +=  c*dt*h;\n    x   += c*h*w;       z   += sn*h*w;\n    dxv += -sn*dt*h*w;  dzv +=  c*dt*h*w;\n  }\n  float W = uSize.x, H = uSize.y;\n  float th0 = sTheta(u,v);\n  P = vec3((x - xe*0.5)*W, (v-0.5)*H + sYoff(u,v), (z - ze*0.5)*W);\n  vec3 Tu = vec3(W*cos(th0), sYdU(u,v), W*sin(th0));\n  vec3 Tv = vec3((dxv - dxe*0.5)*W, H + sYdV(u,v), (dzv - dze*0.5)*W);\n  NN = normalize(cross(Tu, Tv));\n}`;\n\nconst tex = makeCertTexture();\nconst mat = new T.MeshPhysicalMaterial({\n  map: tex, color: new T.Color(0xd9dee7), side: T.DoubleSide, metalness: 0.0,\n  roughness: 0.30, clearcoat: 1.0, clearcoatRoughness: 0.12,\n  iridescence: 0.0,\n  envMapIntensity: 0.80, specularIntensity: 0.85, ior: 1.46,\n  transparent: true, alphaTest: 0.012, opacity: 1\n});\nmat.onBeforeCompile = (sh)=>{\n  Object.assign(sh.uniforms, uni);\n  sh.vertexShader = sh.vertexShader\n    .replace('#include \u003ccommon>', '#include \u003ccommon>\\n'+WAVE)\n    .replace('#include \u003cbeginnormal_vertex>', `\n      vec3 sheetP; vec3 objectNormal;\n      sheetPoint(uv, sheetP, objectNormal);\n      #ifdef USE_TANGENT\n        vec3 objectTangent = vec3( tangent.xyz );\n      #endif\n    `)\n    .replace('#include \u003cbegin_vertex>', 'vec3 transformed = sheetP;');\n  sh.fragmentShader = sh.fragmentShader\n    .replace('#include \u003ccommon>',\n      '#include \u003ccommon>\\nuniform float uRim, uRimA, uSpecA;\\nuniform vec3 uRimCol;')\n    // judge the cut against the artwork's own alpha, not alpha*opacity\n    .replace('#include \u003calphatest_fragment>',\n      'if ( diffuseColor.a / max(opacity,1e-4) \u003c alphaTest ) discard;')\n    .replace('#include \u003coutput_fragment>', `\n      float fres = pow(1.0 - clamp(abs(dot(geometry.normal, geometry.viewDir)),0.0,1.0), 3.2);\n      outgoingLight += fres * uRim * uRimCol;\n      float baseA = diffuseColor.a / max(opacity, 1e-4);\n      float outA  = clamp(ba          * Math.sin(F*uu + TWs*v + t*0.40 + ph);\n  let x=0,z=0,xe=0,ze=0; const N=20, h=1/N;\n  for(let i=0;i\u003cN;i++){\n    const uu=(i+0.5)*h, w=clamp((u-(uu-0.5*h))/h,0,1);\n    const th=theta(uu), c=Math.cos(th), s=Math.sin(th);\n    xe+=c*h; ze+=s*h; x+=c*h*w; z+=s*h*w;\n  }\n  const yo = 0.021*SH*Math.sin(2.05*u + t*0.47 + ph)\n           + 0.013*SH*Math.sin(3.35*u - 1.55*v + t*0.63 + ph)*(1-0.55*v);\n  return _v.set((x-xe*0.5)*SW, (v-0.5)*SH + yo, (z-ze*0.5)*SW);\n}\nfunction buildQuad(){\n  const pts=[];\n  for(const [u,v] of [[0,1],[1,1],[1,0],[0,0]]){\n    cornerPoint(u,v).applyMatrix4(group.matrixWorld).project(camera);\n    pts.push([(_v.x*0.5+0.5)*vw, (-_v.y*0.5+0.5)*vh]);\n  }\n  const cx=(pts[0][0]+pts[1][0]+pts[2][0]+pts[3][0])/4;\n  const cy=(pts[0][1]+pts[1][1]+pts[2][1]+pts[3][1])/4;\n  quad = pts.map(([x,y])=>[cx+(x-cx)*1.07, cy+(y-cy)*1.07]);\n}\nfunction inQuad(px,py){\n  if(!quad) return false;\n  let sign=0;\n  for(let i=0;i\u003c4;i++){\n    const [ax,ay]=quad[i], [bx,by]=quad[(i+1)%4];\n    const c=(bx-ax)*(py-ay)-(by-ay)*(px-ax);\n    if(c!==0){ const s=c>0?1:-1; if(sign===0) sign=s; else if(s!==sign) return false; }\n  }\n  return true;\n}\nfunction useHint(){ hintUsed=true; hintEl.style.opacity='0'; }\n\nconst hostLive = () => { const r = hostRect(); return r.width > 4 && r.height > 4; };\nconst clamp1 = (v) => v \u003c -1 ? -1 : v > 1 ? 1 : v;\nwindow.addEventListener('pointermove', e=>{\n  if(!hostLive()) return;\n  const hr = hostRect(), px = e.clientX - hr.left, py = e.clientY - hr.top;\n  mouse.tx = clamp1((px/vw - 0.5)*2);\n  mouse.ty = clamp1((py/vh - 0.5)*2);\n  if(dragging){\n    const dx=px-lastPX, dy=py-lastPY;\n    lastPX=px; lastPY=py; moved+=Math.abs(dx)+Math.abs(dy);\n    dragYaw   += dx*0.0060;                   // glass prints through, so a\n    dragPitch  = clamp(dragPitch - dy*0.0045, -0.60, 0.60);  // full turn is honest\n    if(moved>40) useHint();\n    return;\n  }\n  overSheet = inQuad(px,py);\n  hoverTarget = to that same silhouette at their own depth,\n   and a dithered pixel wipe uncovers the block the first time it scrolls into view. */\n(function () {\n'use strict';\n\n/* ---------------------------------------------------------------- shaders --- */\n/* Exact GLSL authored in promptui commit c35c24f0e92e80fbfd98f81595bd024e69aa31b4. */\nconst VERTEX_SHADER = `\n  varying vec2 vUv;\n\n  void main() {\n    vUv = uv;\n    gl_Position = vec4(position, 1.0);\n  }\n`;\n\nconst FRAGMENT_SHADER = `\n  uniform float u_time;\n  uniform vec2 u_resolution;\n  varying vec2 vUv;\n\n  float hash(float n) {\n    return fract(sin(n) * 10000.0);\n  }\n\n  float noise(float x) {\n    float i = floor(x);\n    float f = fract(x);\n    float u = f * f * (3.0 - 2.0 * f);\n    return mix(hash(i), hash(i + 1.0), u);\n  }\n\n  void main() {\n    vec2 st = gl_FragCoord.xy / u_resolution.xy;\n\n    float wave1 = sin(st.x * 3.0 + u_time * 0.42) * 0.1;\n    float wave2 = sin(st.x * 5.0 - u_time * 0.28) * 0.05;\n    float wave3 = sin(st.x * 9.0 + u_time * 0.14) * 0.025;\n    float combinedWave = wave1 + wave2 + wave3;\n\n    float baseIntensity = smoothstep(0.48, -0.1, st.y + combinedWave);\n    float variation = noise(st.x * 2.2 + u_time * 0.08) * 0.52 + 0.48;\n    float plume = pow(baseIntensity * variation * 1.35, 1.46);\n\n    float centerFalloff = smoothstep(1.16, 0.34, length((st - vec2(0.5, 0.04)) * vec2(0.86, 1.0)));\n    float sideFalloff = smoothstep(0.92, 0.08, abs(st.x - 0.5));\n    float scan = sin((st.y * 640.0) + u_time * 12.0) * 0.015;\n    float grain = noise(st.x * 70.0 + u_time * 0.18) * 0.025;\n\n    float light = plume * centerFalloff * sideFalloff;\n    vec3 color = vec3(0.0);\n    color += vec3(0.78) * light * 0.52;\n    color += vec3(0.18) * pow(light, 0.72) * 0.24;\n    color += vec3(scan + grain) * light;\n\n    float alpha = clamp(light * 0.72, 0.0, 0.78);\n    gl_FragColor = vec4(color, alpha);\n  }\n`;\n\n/* The source ShaderMaterial injected these declarations around .camY, tgtX = 0, tgtY = P.camY;\n  let F = 1000, OX = 0, OY = 0, phase = 0;\n\n  let envY = new Float32Array(1);   /* upper silhouette raised by the props, per half-device column */\n  let envD = new Float32Array(1);   /* depth (0 far … 1 near) of that silhouette */\n  let EW = 1;\n  let horizonY = 0;\n  let poles = [], posts = [], stars = [], gantries = [];\n\n  /* the envelope is kept at half device resolution: it is the hottest loop in\n     the renderer and a half-pixel of hidden-line jitter is invisible */\n  function rasterInto(px, py, n, depth) {\n    for (let j = 0; j \u003c n - 1; j += 1) {\n      let x0 = px[j] * 0.5, y0 = py[j], x1 = px[j + 1] * 0.5, y1 = py[j + 1];\n      if (x1 \u003c x0) { let t = x0; x0 = x1; x1 = t; t = y0; y0 = y1; y1 = t; }\n      let c0 = Math.ceil(x0), c1 = Math.floor(x1);\n      if (c1 \u003c 0 || c0 >= EW || c1 \u003c c0) continue;\n      if (c0 \u003c 0) c0 = 0;\n      if (c1 > EW - 1) c1 = EW - 1;\n      const dx = x1 - x0, dy = y1 - y0;\n      if (dx \u003c 1e-6) {\n        const y = y0 \u003c y1 ? y0 : y1;\n        if (y \u003c envY[c0]) { envY[c0] = y; envD[c0] = depth; }\n        continue;\n      }\n      for (let c = c0; c \u003c= c1; c += 1) {\n        const y = y0 + dy * ((c - x0) / dx);\n        if (y \u003c envY[c]) { envY[c] = y; envD[c] = depth; }\n      }\n    }\n  }\n\n  const segX = new Float32Array(2), segY = new Float32Array(2);\n  function rasterPoly(pts, depth) {\n    for (let i = 0; i \u003c pts.length - 1; i += 1) {\n      segX[0] = pts[i][0]; segY[0] = pts[i][1];\n      segX[1] = pts[i + 1][0]; segY[1] = pts[i + 1][1];\n      rasterInto(segX, segY, 2, depth);\n    }\n  }\n\n  const envAt = (x) => { const c = (x * 0.5) | 0; return c \u003c 0 || c >= EW ? 1e9 : envY[c]; };\n\n  /* the region still above every silhouette drawn so far, narrowed to the\n     columns a prop actually covers so the clip stays cheap */\n  function clipAbove(x0, x1) {\n    const c0 = Math.max(0, Math.floor(x0 / 2) - 1);\n    const sky ---- */\n  /* Stars and the haze bars that sit on the horizon. Drawn after the ground so\n     they land at the back of the scene, and clipped against the silhouette that\n     everything in front of them has already raised. */\n  function drawSky() {\n    clipAbove(-8, W + 8);\n    const top = horizonY;\n    for (let i = 0; i \u003c stars.length; i += 1) {\n      const st = stars[i];\n      const y = st.y * top;\n      if (y > top - 2) continue;\n      const tw = 0.72 + 0.28 * Math.sin(phase * 1.7 + st.tw);\n      const a = st.a * tw * (0.35 + 0.65 * (1 - st.y));    /* fade into the horizon glow */\n      const sPx = a > 0.42 ? Math.max(1, DPR * 1.3) : Math.max(1, DPR * 0.9);\n      tx.fillStyle = `rgba(${INK},${a.toFixed(3)})`;\n      tx.fillRect(st.x * W, y, sPx, sPx);\n    }\n    /* haze bars: the flat stratus that makes a synthetic sunset read as one */\n    tx.lineWidth = Math.max(1, DPR * 1.1);\n    for (let i = 0; i \u003c 5; i += 1) {\n      const y = top - (8 + i * 13) * DPR;\n      if (y \u003c 0) break;\n      const half = W * (0.42 - i * 0.055);\n      const cx = OX - W * 0.1 + Math.sin(phase * 0.04 + i) * W * 0.02;\n      const g = tx.createLinearGradient(cx - half, 0, cx + half, 0);\n      g.addColorStop(0, `rgba(${INK},0)`);\n      g.addColorStop(0.5, `rgba(${INK},${(0.13 - i * 0.02).toFixed(3)})`);\n      g.addColorStop(1, `rgba(${INK},0)`);\n      tx.strokeStyle = g;\n      tx.beginPath(); tx.moveTo(cx - half, y); tx.lineTo(cx + half, y); tx.stroke();\n    }\n    tx.restore();\n  }\n\n  /* --------------------------------------------------------- the sun ---- */\n  /* Drawn last, so it sits at the back of the scene, and clipped against the\n     silhouette everything in front of it has already raised. */\n  function drawSun() {\n    const r = H * DRIVE.sunR;\n    const cx = OX - W * 0.185, cy = horizonY - r * 0.13;\n    clipAbove(cx - r - 8, cx + r + 8);\n\n    /* it sets behind the ground rather than over it: nothing of the disc, its rim or\n       its halo is drawn below the horizon line */\n    tx.beginPath(); tx.rect(0, 0, W, horizonY); tx.clip();\n\n    const halo = tx.createRadialGradient(cx, cy, r * 0.7, cx, cy, r * 2.5);\n    halo.addColorStop(0, `rgba(${INK},0.09)`);\n    halo.addColorStop(0.45, `rgba(${INK},0.035)`);\n    halo.addColorStop(1, `rgba(${INK},0)`);\n    tx.fillStyle = halo;\n    tx.fillRect(cx - r * 2.5, cy - r * 2.5, r * 5, r * 5);\n\n    tx.lineWidth = Math.max(1, DPR * 0.9);\n    /* the disc itself: an opaque body so the plume does not print through it,\n       then the rim, then the slats that cut it into a retro sun */\n    tx.beginPath(); tx.arc(cx, cy, r, 0, Math.PI * 2);\n    tx.fillStyle = BG; tx.fill();\n    tx.strokeStyle = `rgba(${INK},0.34)`; tx.stroke();\n\n    const grad = tx.createLinearGradient(0, cy - r, 0, cy + r);\n    grad.addColorStop(0, `rgba(${INK},0.09)`);\n    grad.addColorStop(0.52, `rgba(${INK},0.26)`);\n    grad.addColorStop(1, `rgba(${INK},0.52)`);\n    tx.save();\n    tx.beginPath(); tx.arc(cx, cy, r * 0.995, 0, Math.PI * 2); tx.clip();\n    tx.fillStyle = grad; tx.fillRect(cx - r, cy - r, r * 2, r * 2);\n    /* slats widen toward the bottom of the disc — the classic cut */\n    tx.globalCompositeOperation = \"destination-out\";\n    const n = DRIVE.sunSlats;\n    for (let i = 0; i \u003c n; i += 1) {\n      const t = i / (n - 1);\n      const y = cy - r * 0.12 + t * r * 1.06;\n      const h = r * (0.012 + 0.085 * t * t);\n      tx.fillRect(cx - r, y, r * 2, h);\n    }\n    tx.globalCompositeOperation = \"source-over\";\n    tx.restore();\n\n    tx.restore();   /* clipAbove */\n  }\n\n  /* ------------------------------------------ hidden-line drive scene --- */\n  function renderTerrain() {\n    tx.setTransform(1, 0, 0, 1, 0, 0);\n    tx.clearRect(0, 0, W, H);\n    envY.fill(1e9);\n    envD.fill(0);\n\n    tx.lineCap = \"round\";\n    tx.lineJoin = \"round\";\n\n    const zSpan = P.zFar - P.zNear;\n    const cue = (z) => Math.pow(Math.max(0, (P.zFar - z) / zSpan), 0.9);\n    const off = phase % DRIVE.gridZ;\n\n    /* the depth slots the whole scene is ordered by: one per transverse grid\n       line, near to far, with the props that live in each slot drawn first */\n    const slots = [];\n    for (let z = P.zNear + (DRIVE.gridZ - off); z \u003c P.zFar; z += DRIVE.gridZ) slots.push(z);\n\n    /* --- props, keyed to the same phase so the lattice slides as one --- */\n    const propAt = [];\n    const overhead = [];   /* the gantries: floating geometry, so they are painted last */\n    for (let i = 0; i \u003c poles.length; i += 1) {\n      const p = poles[i];\n      const z = P.zNear + ((p.k * DRIVE.poleZ - phase) % (poles.length * DRIVE.poleZ) + poles.length * DRIVE.poleZ) % (poles.length * DRIVE.poleZ);\n      if (z \u003c P.zFar) propAt.push({ z, kind: \"pole\", p });\n    }\n    for (let i = 0; i \u003c posts.length; i += 1) {\n      const p = posts[i];\n      const span = posts.length * DRIVE.postZ;\n      const z = P.zNear + (((p.k * DRIVE.postZ - phase) % span) + span) % span;\n      if (z \u003c P.zFar) propAt.push({ z, kind: \"post\", p });\n    }\n    for (let i = 0; i \u003c gantries.length; i += 1) {\n      const g = gantries[i], span = gantries.length * DRIVE.gantryZ;\n      const z = P.zNear + (((g.k * DRIVE.gantryZ - phase) % span) + span) % span;\n      if (z \u003c P.zFar) overhead.push({ z, p: g });\n    }\n    propAt.sort((a, b) => a.z - b.z);\n    overhead.sort((a, b) => b.z - a.z);\n\n    let pi = 0;\n    let prevZ = P.zNear;\n    const lonMax = Math.ceil(DRIVE.halfX / DRIVE.gridX);\n\n    for (let s = 0; s \u003c slots.length; s += 1) {\n      const z = slots[s];\n      while (pi \u003c propAt.length && propAt[pi].z \u003c z) { drawProp(propAt[pi], cue(propAt[pi].z)); pi += 1; }\n\n      const invZ = F / z, invP = F / prevZ;\n      const sy = projY(0, invZ);\n      const d = cue(z);\n\n      /* longitudinal lines, segment by segment between the two depths, so each\n         cell of the grid i + 0.62 * d).toFixed(3)})`;\n      tx.stroke();\n      prevZ = z;\n    }\n    while (pi \u003c propAt.length) { drawProp(propAt[pi], cue(propAt[pi].z)); pi += 1; }\n\n    drawRoad();\n    drawSky();\n    drawSun();\n    /* An overhead structure cannot be expressed in a min-y envelope: rastering the\n       beam would raise the silhouette across the whole span and black out the road\n       beneath it. So the gantries are painted after the ground, far to near, each\n       clipped against the silhouette the ground and the standards already raised —\n       and after the sky, so a sign always reads in front of the moon. */\n    for (let i = 0; i \u003c overhead.length; i += 1) drawGantry(overhead[i].p, overhead[i].z, cue(overhead[i].z));\n\n    /* the road plane's own silhouette is the far edge of the grid; the props\n       stand above it, banded by depth so nothing draws a hard skyline */\n    const BANDS = 7;\n    tx.lineWidth = Math.max(1, DPR * 0.85);\n    for (let b = 0; b \u003c BANDS; b += 1) {\n      tx.beginPath();\n      let started = false;\n      for (let c = 0; c \u003c EW; c += 1) {\n        const y = envY[c];\n        if (y > H + 2) { started = false; continue; }\n        const bb = Math.min(BANDS - 1, ((1 - envD[c]) * BANDS) | 0);\n        if (bb !== b) { started = false; continue; }\n        if (!started) { tx.moveTo(c * 2, y); started = true; } else tx.lineTo(c * 2, y);\n      }\n      const a = 0.045 + 0.5 * Math.pow(1 - b / (BANDS - 1), 1.35);\n      tx.strokeStyle = `rgba(${INK},${a.toFixed(3)})`;\n      tx.stroke();\n    }\n    line([[0, horizonY], [W, horizonY]], 0.5, Math.max(1, DPR * 0.9));\n\n    /* opaque body behind every stroke, so the plume is occluded by the ground */\n    tx.globalCompositeOperation = \"destination-over\";\n    tx.beginPath();\n    tx.moveTo(-2, H + 2);\n    for (let c = 0; c \u003c EW; c += 1) {\n      const e = envY[c];\n      const y = e \u003c horizonY ? e : horizonY;\n      tx.lineTo(c * 2, y > H + 2 ? H + 2 : y);\n    }\n    tx.lineTo(W + 2, H + 2);\n    tx.closePath();\n    tx.fillStyle = BG;\n    tx.fill();\n    tx.globalCompositeOperation = \"source-over\";\n\n    tapePass();\n  }\n\n  /* ---------------------------------------------------------- tape pass --- */\n  const TAPE = { bandPx: 11, wobble: 1.5, tear: 0.055, tearSkew: 20, fringe: 0.3 };\n  function tapePass() {\n    vx.setTransform(1, 0, 0, 1, 0, 0);\n    vx.globalCompositeOperation = \"source-over\";\n    vx.globalAlpha = 1;\n    vx.clearRect(0, 0, W, H);   /* the sky is transparent here: the plume sits behind it */\n\n    const t = phase * 0.9;\n    const bh = Math.max(2, Math.round(TAPE.bandPx * DPR));\n    const bands = Math.ceil(H / bh);\n    const tearAt = 1 - TAPE.tear;\n    for (let i = 0; i \u003c bands; i += 1) {\n      const y = i * bh;\n      const v = (y + bh * 0.5) / H;\n      /* two slow beats plus a per-band flutter, so no row sits perfectly still */\n      let dx = Math.sin(v * 26.0 + t * 2.1) * 0.8 + Math.sin(v * 6.1 - t * 1.3) * 1.5;\n      dx += (ihash(i, Math.floor(t * 7)) - 0.5) * 2.0;\n      dx *= TAPE.wobble * DPR;\n      if (v > tearAt) dx += ((v - tearAt) / TAPE.tear) * TAPE.tearSkew * DPR;\n      const h = Math.min(bh + 1, H - y);\n      vx.drawImage(work, 0, y, W, h, dx, y, W, h);\n    }\n\n    /* colour fringe: the plate laid twice more, warm one way and cool the other */\n    if (TAPE.fringe > 0 && typeof vx.filter === \"string\") {\n      const off = 1.6 * DPR;\n      vx.globalCompositeOperation = \"lighter\";\n      vx.globalAlpha = TAPE.fringe;\n      vx.filter = \"sepia(1) saturate(7) hue-rotate(-32deg) brightness(0.62)\";\n      vx.drawImage(work, off, 0);\n      vx.filter = \"sepia(1) saturate(6) hue-rotate(150deg) brightness(0.52)\";\n      vx.drawImage(work, -off, 0);\n      vx.filter = \"none\";\n      vx.globalAlpha = 1;\n      vx.globalCompositeOperation = \"source-over\";\n    }\n  }\n\n  /* lane edges and the dashed centre line, both scrolling on the phase clock */\n  function drawRoad() {\n    const iN = F / P.zNear, iFar = F / (P.zFar * 0.86);\n    for (let side = -1; side \u003c= 1; side += 2) {\n      const x = side * DRIVE.laneHalf;\n      line([[projX(x, iN), projY(0, iN)], [projX(x, iFar), projY(0, iFar)]], 0.62, Math.max(1, DPR * 1.0));\n    }\n    const period = DRIVE.dashLen + DRIVE.dashGap;\n    const off = phase % period;\n    tx.fillStyle = `rgba(${INK},0.5)`;\n    for (let z = P.zNear - off; z \u003c P.zFar * 0.8; z += period) {\n      const z0 = Math.max(P.zNear, z), z1 = z + DRIVE.dashLen;\n      if (z1 \u003c= P.zNear) continue;\n      const i0 = F / z0, i1 = F / z1;\n      const w0 = 0.055 * i0, w1 = 0.055 * i1;\n      const y0 = projY(0, i0), y1 = projY(0, i1);\n      const cx0 = projX(0, i0), cx1 = projX(0, i1);\n      if (y1 > envAt(cx1) - 0.5 && y0 > envAt(cx0) - 0.5) continue;\n      tx.beginPath();\n      tx.moveTo(cx0 - w0, y0); tx.lineTo(cx0 + w0, y0);\n      tx.lineTo(cx1 + w1, y1); tx.lineTo(cx1 - w1, y1);\n      tx.closePath(); tx.fill();\n    }\n  }\n\n  /* an overhead sign gantry: two legs, a truss beam and a blank panel, all cut\n     into the same silhouette so the grid and the sky behind them are occluded */\n  function drawGantry(g, z, cue) {\n    if (z \u003c DRIVE.gantryNear) return;\n    const invZ = F / z;\n    const outer = DRIVE.laneHalf + 0.72;\n    const top = projY(g.h, invZ), road = projY(0, invZ);\n    const lw = Math.max(0.8, 0.021 * invZ);\n    const beamH = Math.max(1.3, 0.062 * invZ);\n    if (top > H + 6 || road \u003c -40) return;\n    const lx = projX(-outer, invZ), rx2 = projX(outer, invZ);\n    if (rx2 \u003c -60 || lx > W + 60) return;\n    clipAbove(Math.min(lx, 0) - 8, Math.max(rx2, W) + 8);\n    tx.lineWidth = Math.max(1, DPR * 0.55);\n    const legs = [];\n    for (const bx of [lx, rx2]) {\n      const leg = [[bx - lw, road], [bx + lw, road], [bx + lw, top], [bx - lw, top]];\n      solid(leg, 0.26 + 0.26 * cue);\n      legs.push(leg);\n    }\n    const beam = [[lx - lw, t
