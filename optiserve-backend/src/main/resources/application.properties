spring.application.name=optiserve-backend

spring.datasource.url=${OPTISERVE_DB_URL}
spring.datasource.username=${OPTISERVE_DB_USERNAME}
spring.datasource.password=${OPTISERVE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Only expose safe health data publicly; security rules keep metrics admin-only.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

security.jwt.secret=${OPTISERVE_JWT_SECRET}
security.jwt.expiration=PT1H

optiserve.admin.bootstrap.enabled=${OPTISERVE_ADMIN_BOOTSTRAP_ENABLED:false}
optiserve.admin.email=${OPTISERVE_ADMIN_EMAIL:}
optiserve.admin.password=${OPTISERVE_ADMIN_PASSWORD:}

optiserve.ml.base-url=${OPTISERVE_ML_BASE_URL:http://localhost:8000}
optiserve.ml.connect-timeout=${OPTISERVE_ML_CONNECT_TIMEOUT:250ms}
optiserve.ml.response-timeout=${OPTISERVE_ML_RESPONSE_TIMEOUT:1s}
optiserve.ml.service-time-zone=${OPTISERVE_ML_SERVICE_TIME_ZONE:Asia/Kolkata}
optiserve.ml.minimum-duration-minutes=${OPTISERVE_ML_MINIMUM_DURATION_MINUTES:5}
optiserve.ml.maximum-duration-minutes=${OPTISERVE_ML_MAXIMUM_DURATION_MINUTES:1440}
