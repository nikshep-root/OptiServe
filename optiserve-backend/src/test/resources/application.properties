spring.datasource.url=${OPTISERVE_DB_URL}
spring.datasource.username=${OPTISERVE_DB_USERNAME}
spring.datasource.password=${OPTISERVE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

security.jwt.secret=VGhpc0lzQVRlc3RPbmx5U2VjcmV0S2V5Rm9ySFRUUFN
security.jwt.expiration=PT1H

# Keep backend tests independent of a running FastAPI process.
optiserve.ml.base-url=http://127.0.0.1:1
optiserve.ml.connect-timeout=50ms
optiserve.ml.response-timeout=50ms
